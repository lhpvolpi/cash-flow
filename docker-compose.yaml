name: cash-flow

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    container_name: cash-flow-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=-c shared_preload_libraries=pg_stat_statements
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cash-flow-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: always
    container_name: cash-flow-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cash-flow-network

  transactions-web:
    build:
      context: services/transactions/src/CashFlow.Transactions.Web
    profiles: ["app"]
    restart: always
    container_name: cash-flow-transactions-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=transactions;Username=postgres;Password=postgres
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "5222:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cash-flow-network

  transactions-outbox:
    build:
      context: services/transactions/src/CashFlow.Transactions.Outbox
    profiles: ["app"]
    restart: always
    container_name: cash-flow-transactions-outbox
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=transactions;Username=postgres;Password=postgres
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "5223:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      transactions-web:
        condition: service_started
    networks:
      - cash-flow-network

  consolidation-web:
    build:
      context: services/consolidation/src/CashFlow.Consolidation.Web
    profiles: ["app"]
    restart: always
    container_name: cash-flow-consolidation-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=consolidation;Username=postgres;Password=postgres
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "5224:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cash-flow-network

  consolidation-consumer:
    build:
      context: services/consolidation/src/CashFlow.Consolidation.Consumer
    profiles: ["app"]
    restart: always
    container_name: cash-flow-consolidation-consumer
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=consolidation;Username=postgres;Password=postgres
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672/
    ports:
      - "5225:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consolidation-web:
        condition: service_started
    networks:
      - cash-flow-network

  auth-web:
    build:
      context: services/auth/src/CashFlow.Auth.Web
    profiles: ["app"]
    restart: always
    container_name: cash-flow-auth-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5226:8080"
    networks:
      - cash-flow-network

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  cash-flow-network:
    driver: bridge
